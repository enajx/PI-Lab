<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lock the renderer down: no remote code, scripts/styles from self only.
         `unsafe-inline` style is required by Tailwind/Vite injected styles.
         `img-src` allows `data:`/`blob:` so dropped thumbnails (read into a
         data URL) and the inline SVG grain overlay render. PDF.js uses local
         workers and WASM decoders, plus blob URLs for embedded PDF fonts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; font-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src pi-lab-report: http://127.0.0.1:*"
    />
    <title>PI Lab</title>
    <!-- Pre-paint fallback only (warm near-black, matches the dark theme bg) so
         there's no white flash before the Tailwind theme variables load. The
         real background comes from @pi-lab/ui globals.css. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background-color: oklch(0.18 0.005 75);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
