name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PI Lab is local-only: the env-validation gate is effectively always-on
  # (AGENTS.md §12.6 / Rule 10). Set it for any build/test step that reads env.
  SKIP_ENV_VALIDATION: "1"

jobs:
  # ── Static checks (no native ABI involved) ──────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # `--ignore-scripts`: lint needs no native binaries, so skip the native
      # postinstall/build entirely (keeps the static jobs fast + ABI-agnostic).
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run docs:build

  # Unit and integration tests validate native loading under Node.
  test:
    name: Test (Node)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      # Linux: node-gyp toolchain headers for any from-source native compile.
      - name: Linux native build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev
      # Install native prebuilds or compile node-pty when no prebuild matches.
      # Native postinstall scripts may both bootstrap node-gyp in /tmp. Run them
      # in sequence so one script cannot read the other's incomplete install.
      - run: bun install --frozen-lockfile --concurrent-scripts 1
      # Prepare the macOS PTY helper, then validate both native modules in Node.
      - name: Setup native modules (node-pty)
        run: bun run --cwd apps/desktop setup:native
      - run: bun run test

  # Whole-app E2E validates the same N-API binaries under Electron.
  # Linux needs xvfb for Electron's display; macOS runs without a visible window.
  e2e:
    name: E2E (Electron)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Linux native build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev xvfb
      - run: bun install --frozen-lockfile --concurrent-scripts 1
      # Prepare the macOS PTY helper and check native loading under Node.
      - name: Setup native modules (node-pty)
        run: bun run --cwd apps/desktop setup:native
      # Native modules also must load under the Electron runtime that runs E2E.
      - name: Validate native modules
        run: bun run --cwd apps/desktop validate:native
      - run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      # E2E against the electron-vite build (`out/main/index.js`). Electron has no
      # true headless mode, so Linux runs under a virtual framebuffer.
      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: bun run e2e
      - name: E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
