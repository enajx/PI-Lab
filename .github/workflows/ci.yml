name: CI

on:
  push:
    branches: [main, skipper_new]
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skipper is local-only: the env-validation gate is effectively always-on
  # (AGENTS.md §12.6 / Rule 10). Set it for any build/test step that reads env.
  SKIP_ENV_VALIDATION: "1"

jobs:
  # ── Static checks (no native ABI involved) ──────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # `--ignore-scripts`: lint needs no native binaries, so skip the native
      # postinstall/build entirely (keeps the static jobs fast + ABI-agnostic).
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck

  # ── Unit + integration tests (NODE ABI) ─────────────────────────────────────
  # CRITICAL — ABI sequencing (AGENTS.md §13): native modules install prebuilt for
  # the host *Node* ABI, which is exactly what Vitest (`bun run test`) needs. This
  # job NEVER runs `@electron/rebuild`, so the Node ABI is never disturbed here.
  # The Electron ABI lives only in the separate `e2e` job — the two never collide
  # in one checkout.
  test:
    name: Test (Node ABI)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Linux: node-gyp toolchain headers for any from-source native compile.
      - name: Linux native build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev
      # Full install (WITH scripts) so native modules build prebuilt for Node ABI.
      - run: bun install --frozen-lockfile
      - run: bun run test

  # ── Whole-app E2E (ELECTRON ABI) ────────────────────────────────────────────
  # Rebuilds the native modules for Electron's ABI, builds the app, and drives it
  # via Playwright `_electron`. Runs in a SEPARATE checkout from `test` so the
  # Electron rebuild never clobbers the Node-ABI install the test job relies on.
  # Linux has no display → wrap Electron in `xvfb-run`; macOS runs it invisibly.
  e2e:
    name: E2E (Electron ABI)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Linux native build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev xvfb
      - run: bun install --frozen-lockfile
      # Flip native modules to the Electron ABI (better-sqlite3 recompiles; node-pty
      # is N-API and unaffected). MUST come before building/launching the app.
      - name: Rebuild native modules (Electron ABI)
        run: bun run --cwd apps/desktop rebuild:native:electron
      # Validate the rebuilt addons load under Electron before we package/launch.
      - name: Validate native modules
        run: bun run --cwd apps/desktop validate:native
      - run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      # E2E against the electron-vite build (`out/main/index.js`). Electron has no
      # true headless mode, so Linux runs under a virtual framebuffer.
      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: bun run e2e
      - name: E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
