name: CI

on:
  # Run local checks by default; request hosted platform checks explicitly.
  workflow_dispatch:
  # Release workflows call CI on the exact commit they build.
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to check out and test
        required: true
        type: string

# Manual runs cancel superseded runs on the same ref. A called run gets a group
# of its own (caller run id) and is never cancelled by another run.
concurrency:
  group: ${{ inputs.ref && format('ci-call-{0}-{1}', github.run_id, github.run_attempt) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !inputs.ref }}

env:
  # CI runs without a local user environment. Set this for build and test steps.
  SKIP_ENV_VALIDATION: "1"

jobs:
  # ── Static checks (no native ABI involved) ──────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Called: the caller's commit. Manual: the dispatch commit.
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # `--ignore-scripts`: lint needs no native binaries, so skip the native
      # postinstall/build entirely (keeps the static jobs fast + ABI-agnostic).
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Called: the caller's commit. Manual: the dispatch commit.
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck

  # Unit and integration tests validate native loading under Node.
  test:
    name: Test (Node)
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Called: the caller's commit. Manual: the dispatch commit.
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      # Linux: node-gyp toolchain headers for any from-source native compile.
      - name: Linux native build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev
      # Install native prebuilds or compile node-pty when no prebuild matches.
      # Native postinstall scripts may both bootstrap node-gyp in /tmp. Run them
      # in sequence so one script cannot read the other's incomplete install.
      - run: bun install --frozen-lockfile --concurrent-scripts 1
      # Prepare the macOS PTY helper, then validate both native modules in Node.
      - name: Setup native modules (node-pty)
        run: bun run --cwd apps/desktop setup:native
      - run: bun run test
      - run: bun run test:scripts

  # Whole-app E2E validates the same N-API binaries under Electron.
  # Linux needs xvfb for Electron's display; macOS runs without a visible window.
  e2e:
    name: E2E (Electron)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Called: the caller's commit. Manual: the dispatch commit.
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Linux native build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev xvfb
      - run: bun install --frozen-lockfile --concurrent-scripts 1
      # Prepare the macOS PTY helper and check native loading under Node.
      - name: Setup native modules (node-pty)
        run: bun run --cwd apps/desktop setup:native
      # Native modules also must load under the Electron runtime that runs E2E.
      - name: Validate native modules
        run: bun run --cwd apps/desktop validate:native
      - run: bun run build
      # E2E against the electron-vite build (`out/main/index.js`). Electron has no
      # true headless mode, so Linux runs under a virtual framebuffer.
      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: node node_modules/@playwright/test/cli.js test
      - name: E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node node_modules/@playwright/test/cli.js test
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            .cache/test-results/
            playwright-report/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
